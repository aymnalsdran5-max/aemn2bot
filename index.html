<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModStore - متجر التطبيقات والبوتات والقرآن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0f172a', cardBg: '#1e293b' } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-darkBg/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-3 h-16 flex items-center justify-between gap-3">
            <a href="#" onclick="navigate('home')" class="flex items-center gap-2 text-base font-black text-white shrink-0">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-gamepad text-white text-sm"></i>
                </div>
                <span>Mod<span class="text-indigo-500">Store</span></span>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ابحث عن تطبيق، بوت، أو سورة..." class="w-full bg-slate-900 border border-slate-700/80 rounded-full py-1.5 pr-8 pl-3 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- HOME VIEW -->
        <div id="homeView" class="space-y-6">
            
            <!-- Hero Banner -->
            <div class="rounded-3xl bg-gradient-to-r from-indigo-900/80 via-purple-900/50 to-slate-900 p-6 border border-indigo-500/20 shadow-2xl relative overflow-hidden">
                <div class="relative z-10 space-y-2 max-w-xl">
                    <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30 inline-flex items-center gap-1">
                        <i class="fa-solid fa-shield-halved"></i> مفحوص وآمن 100%
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-black text-white leading-snug">أقوى متجر للتطبيقات والبوتات والقرآن</h1>
                    <p class="text-slate-300 text-xs">تحميل مباشر وسريع وبدون إعلانات مزعجة.</p>
                </div>
            </div>

            <!-- Telegram Channel Promo Banner -->
            <a href="https://t.me/s_ensn" target="_blank" class="flex items-center justify-between bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 text-white p-4 rounded-2xl shadow-lg transition">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl">
                        <i class="fa-brands fa-telegram"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-xs sm:text-sm">انضم لقناتنا الرسمية على تيليجرام</h4>
                        <p class="text-[10px] text-sky-100">احصل على التحديثات والملفات الجديدة فور نزولها</p>
                    </div>
                </div>
                <span class="bg-white text-sky-600 text-xs font-black px-3 py-1.5 rounded-xl shrink-0">اشتراك</span>
            </a>

            <!-- TOP DOWNLOADS SECTION -->
            <div id="topDownloadsSection" class="space-y-3">
                <h2 class="text-base font-bold flex items-center gap-2 text-amber-400">
                    <i class="fa-solid fa-crown text-amber-400"></i> الأكثر تحميلاً ورواجاً
                </h2>
                <div id="topGrid" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
            </div>

            <!-- Categories Bar -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2">
                <button onclick="filterCategory('all')" class="cat-btn active px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition whitespace-nowrap">الكل</button>
                <button onclick="filterCategory('apk')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap"><i class="fa-brands fa-android ml-1"></i> ألعاب وتطبيقات</button>
                <button onclick="filterCategory('quran')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-book-quran ml-1"></i> قرآن وأناشيد</button>
                <button onclick="filterCategory('bot')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap"><i class="fa-solid fa-robot ml-1"></i> بوتات تيليجرام</button>
            </div>

            <!-- Apps Grid -->
            <div>
                <h2 class="text-base font-bold mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-amber-500"></i> القائمة العامة
                </h2>
                <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <div class="col-span-full text-center py-10 text-slate-400 text-sm">جاري جلب المحتوى من القناة...</div>
                </div>
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="detailView" class="hidden space-y-5">
            <button onclick="navigate('home')" class="inline-flex items-center gap-2 text-slate-400 hover:text-white transition font-semibold text-xs">
                <i class="fa-solid fa-arrow-right"></i> العودة للمتجر
            </button>
            <div id="appDetailContent"></div>
        </div>

    </main>

    <!-- FIREBASE SERVICES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDujZqLLN3nfSybLKSJavNTSBG0Bv7Lq0U",
            authDomain: "aemnstore.firebaseapp.com",
            projectId: "aemnstore",
            storageBucket: "aemnstore.firebasestorage.app",
            messagingSenderId: "418588320744",
            appId: "1:418588320744:web:50749f1cd6e87e8c01ba5d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allItems = [];

        window.navigate = (view) => {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            
            if(view === 'home') document.getElementById('homeView').classList.remove('hidden');
            if(view === 'detail') document.getElementById('detailView').classList.remove('hidden');
            
            window.scrollTo({top:0, behavior:'smooth'});
        };

        async function loadApps() {
            const grid = document.getElementById('appsGrid');
            try {
                const snap = await getDocs(collection(db, "apps"));
                allItems = [];
                snap.forEach(d => allItems.push({ id: d.id, ...d.data() }));
                
                renderTopDownloads(allItems);
                renderAppsGrid(allItems);
            } catch(e) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-400 text-xs">خطأ في استجابة الفايربيس</div>`;
            }
        }

        function renderTopDownloads(items) {
            const topGrid = document.getElementById('topGrid');
            const sorted = [...items].sort((a, b) => (b.downloads || 0) - (a.downloads || 0)).slice(0, 3);
            
            if (sorted.length === 0) {
                document.getElementById('topDownloadsSection').classList.add('hidden');
                return;
            }

            document.getElementById('topDownloadsSection').classList.remove('hidden');
            topGrid.innerHTML = sorted.map((item, idx) => `
                <div onclick="viewAppDetail('${item.id}')" class="bg-gradient-to-r from-slate-900 to-indigo-950/40 border border-amber-500/30 rounded-2xl p-3 cursor-pointer hover:border-amber-400 transition shadow-lg flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="relative">
                            <img src="${item.iconUrl}" class="w-12 h-12 rounded-2xl object-cover bg-slate-900 shrink-0 border border-amber-500/30">
                            <span class="absolute -top-1.5 -right-1.5 bg-amber-500 text-black text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center">#${idx + 1}</span>
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-white text-xs truncate">${item.title}</h3>
                            <p class="text-[10px] text-amber-400 font-bold truncate mt-0.5"><i class="fa-solid fa-download ml-0.5"></i> ${item.downloads || 0} تنزيل</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.handleSearch = (q) => {
            const filtered = allItems.filter(i => i.title.toLowerCase().includes(q.toLowerCase()));
            renderAppsGrid(filtered);
        };

        window.filterCategory = (type) => {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('bg-indigo-600', 'text-white'));
            const filtered = type === 'all' ? allItems : allItems.filter(i => {
                if(type === 'apk') return i.type === 'apk';
                if(type === 'quran') return i.type === 'quran';
                if(type === 'bot') return i.type === 'bot';
            });
            renderAppsGrid(filtered);
        };

        function renderAppsGrid(items) {
            const grid = document.getElementById('appsGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 text-xs">لا يتوفر أي عنصر حالياً.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div onclick="viewAppDetail('${item.id}')" class="bg-cardBg border border-slate-800 rounded-2xl p-3.5 cursor-pointer hover:border-indigo-500 transition shadow-lg flex items-center justify-between">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${item.iconUrl}" class="w-12 h-12 rounded-2xl object-cover bg-slate-900 shrink-0">
                        <div class="overflow-hidden">
                            <div class="flex items-center gap-1">
                                <h3 class="font-bold text-white text-xs truncate">${item.title}</h3>
                                <i class="fa-solid fa-circle-check text-sky-400 text-[10px]" title="موثوق"></i>
                            </div>
                            <p class="text-[10px] text-indigo-400 font-semibold truncate mt-0.5">${item.type === 'bot' ? 'بوت تيليجرام' : (item.type === 'quran' ? 'قرآن كريم / أنشودة' : (item.modFeatures || 'نسخة آمنة'))}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="bg-slate-800 text-slate-400 text-[9px] px-2 py-0.5 rounded-full">${item.version || 'مباشر'}</span>
                                ${item.size ? `<span class="bg-indigo-900/50 text-indigo-300 text-[9px] px-2 py-0.5 rounded-full border border-indigo-500/30">${item.size}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-slate-500 text-xs"></i>
                </div>
            `).join('');
        }

        window.viewAppDetail = async (id) => {
            navigate('detail');
            const docSnap = await getDoc(doc(db, "apps", id));
            const item = docSnap.data();

            document.getElementById('appDetailContent').innerHTML = `
                <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 space-y-6">
                    <div class="flex items-center gap-4">
                        <img src="${item.iconUrl}" class="w-20 h-20 rounded-2xl object-cover shadow-2xl bg-slate-900">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <h1 class="text-xl font-black text-white">${item.title}</h1>
                                <i class="fa-solid fa-circle-check text-sky-400 text-sm" title="موثوق"></i>
                            </div>
                            <p class="text-indigo-400 text-xs font-bold mt-1">${item.type === 'bot' ? 'بوت رسمي' : (item.modFeatures || 'نسخة آمنة')}</p>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="text-emerald-400 text-xs font-bold"><i class="fa-solid fa-download ml-1"></i>${item.downloads || 0} التحميلات</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 text-center space-y-3">
                        <a href="${item.type === 'bot' ? item.botUrl : item.apkUrl}" target="_blank" onclick="incrementDown('${id}')" class="block w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition">
                            <i class="fa-solid ${item.type === 'bot' ? 'fa-robot' : 'fa-download'} ml-1"></i> ${item.type === 'bot' ? 'افتح البوت في تيليجرام' : 'تنزيل الملف المباشر'}
                        </a>
                    </div>

                    <div class="space-y-2">
                        <h3 class="text-sm font-bold text-white">الشرح والتفاصيل</h3>
                        <p class="text-slate-300 text-xs leading-relaxed bg-slate-900/60 p-4 rounded-2xl border border-slate-800">${item.description}</p>
                    </div>
                </div>
            `;
        };

        window.incrementDown = async (id) => {
            await updateDoc(doc(db, "apps", id), { downloads: increment(1) });
        };

        loadApps();
    </script>
</body>
</html>
